hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  mlp_channel_consistency:
    enabled: true
    # Every actor optimizer step samples exactly this fraction independently in
    # every dense SwiGLU layer. Values are literal zero/one, with no rescaling.
    mask_ratio: 0.10
    random_seed: 42
    kl_coef: 0.01
    # Positive: exact KL over clean top-k tokens plus one aggregate tail bucket.
    # Zero: full categorical KL (substantially more activation memory).
    kl_top_k: 64
    # KL materializes response-vocabulary logits, so it uses a smaller batch
    # than the clean GRPO branch by default.
    micro_batch_size_per_gpu: 1
    # Fixed stratified coordinate sample used for the per-update auxiliary/main
    # gradient RMS ratio. Memory is about 2 MiB per rank for the two FP32 vectors.
    gradient_sample_size_per_rank: 262144
    # Mukherjee et al.'s BF16 update-sparsity threshold. Kept fixed for direct
    # comparison with the published metric.
    parameter_update_atol: 1.0e-5

  actor:
    force_on_policy: true
    use_rollout_log_probs: true
    use_fused_kernels: false
    ppo_epochs: 1
    loss_agg_mode: token-mean
    ulysses_sequence_parallel_size: 1

  rollout:
    name: vllm
    mode: sync
    n: 16
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  rollout_correction:
    bypass_old_logprob_for_rollout: false
    rollout_is: null
    rollout_rs: null

reward_model:
  reward_manager: naive

trainer:
  project_name: MLP-Channel-Consistency
  merge_duplicate_val_prompts: true
  validation_pass_reward_threshold: 0.0
